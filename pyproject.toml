[project]
authors = [
    { name = "Omar Salama", email = "omarsalama117@gmail.com" },
    { name = "Abu Bakr Soliman (cohereX original author)" }
]
name = "coherevoice"
version = "1.0.0"
description = "CohereVoice Studio: Advanced Speech Recognition, Broadcast Subtitles & Meeting Intelligence Suite."
readme = "README.md"
requires-python = ">=3.10, <3.14"
license = { text = "Apache-2.0" }
keywords = ["asr", "speech-recognition", "transcription", "subtitles", "meeting-notes", "cohere", "arabic-dialect", "translation", "diarization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "transformers>=5.4.0",
    "accelerate>=0.28.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "sentencepiece>=0.2.0",
    "protobuf>=4.0.0",
    "nltk>=3.9.1",
    "numpy>=2.1.0",
    "omegaconf>=2.3.0",
    "pandas>=2.2.3",
    "pyannote-audio>=4.0.0",
    "huggingface-hub>=0.28.1",
    "torch>=2.8.0",
    "torchaudio>=2.8.0",
    "streamlit>=1.40.0",
    "deep-translator>=1.11.0",
    "google-genai>=1.0.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/omarsalama4/coherevoice-studio"
Repository = "https://github.com/omarsalama4/coherevoice-studio"
Issues = "https://github.com/omarsalama4/coherevoice-studio/issues"

[project.optional-dependencies]
dev = ["pytest"]
langid = ["langdetect>=1.0.9"]
vllm = ["httpx>=0.27.0", "vllm[audio]>=0.19.0"]
all = ["coherevoice[langid,vllm]"]

[project.scripts]
coherevoice = "coherex.__main__:cli"

[build-system]
requires = ["setuptools"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["coherex*"]

[tool.setuptools.package-data]
coherex = ["assets/*"]
