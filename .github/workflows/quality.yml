name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,langid]"
      - run: python -m pytest -q
      - run: python -m pip check
      # Both exceptions are documented and mitigated in SECURITY.md.
      - run: python -m pip_audit --ignore-vuln PYSEC-2026-3624 --ignore-vuln PYSEC-2026-3447
